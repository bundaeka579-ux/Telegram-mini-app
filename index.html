<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sgpjoingroupsbot</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#202b36;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin:20px 0 30px;
    font-size:30px;
}

#status{
    background:#34495e;
    padding:16px;
    border-radius:12px;
    margin-bottom:25px;
    font-size:20px;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:18px 10px;
    margin:7px 0;
    font-size:18px;
    font-weight:bold;
    color:white;
}

.blue{
    background:#2d8cff;
}

.red{
    background:#f04455;
}

button:active{
    opacity:.7;
}
</style>
</head>

<body>

<h1>⚡ TELEGRAM BOT ⚡</h1>

<div id="status">🟢 BOT AKTIF</div>

<button class="blue" onclick="setGroup()">
🔗 SET GROUP LINK
</button>

<button class="blue" onclick="setMedia()">
🖼️ SET MEDIA + CAPTION
</button>

<button class="blue" onclick="setText()">
💬 SET TEXT SAJA
</button>

<button class="red" onclick="deleteMedia()">
🗑️ HAPUS MEDIA
</button>

<script>
function setGroup(){
    document.getElementById("status").innerText="🔗 SET GROUP LINK";
}

function setMedia(){
    document.getElementById("status").innerText="🖼️ SET MEDIA + CAPTION";
}

function setText(){
    document.getElementById("status").innerText="💬 SET TEXT SAJA";
}

function deleteMedia(){
    document.getElementById("status").innerText="🗑️ MEDIA DIHAPUS";
}
</script>

</body>
</html>
